<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Mingle</title>
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <!-- This meta viewport ensures the webpage's dimensions change according to the device it's on. This is called Responsive Web Design.-->
  <meta name="viewport" content=" width=device-width, initial-scale=1.0, , " />
  <meta name="description" content="A calm, focused space for conversations and live voice calls." />

  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#163b35" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#1f5048" />

  <!-- These meta tags are Apple-specific, and set the web application to run in full-screen mode with a black status bar. Learn more at https://developer.apple.com/library/archive/documentation/AppleApplications/Reference/SafariHTMLRef/Articles/MetaTags.html-->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Mingle" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />

  <!-- This tag is used by the PWA Starter CLI to identify template projects. Don't remove if you are using the CLI. -->
  <meta name="pwa-starter-template-identity" content="pwa-starter" />

  <!-- Imports an icon to represent the document. -->
  <link rel="icon" href="assets/icons/icon_24.png" type="image/png" />

  <!-- Imports the manifest to represent the web application. A web app must have a manifest to be a PWA. -->
  <link rel="manifest" href="manifest.json" />

  <!-- Web Awesome global styles / theme -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@awesome.me/webawesome@3.10.0/dist/styles/webawesome.css" />
  <link rel="stylesheet" href="global.css" />


  <!-- Web Awesome uses class-based color schemes. Track the OS preference. -->
  <script>
    (() => {
      const root = document.documentElement;
      const media = window.matchMedia('(prefers-color-scheme: dark)');
      const applyScheme = (isDark) => {
        root.classList.toggle('wa-dark', isDark);
        root.classList.toggle('wa-light', !isDark);
      };
      applyScheme(media.matches);
      media.addEventListener('change', (event) => applyScheme(event.matches));
    })();
  </script>

  <script type="module" src="/src/app-index.ts"></script>
</head>

<body>
  <!-- Our app-index web component. This component is defined in src/pages/app-index.ts-->
  <app-index></app-index>

  <script>
    if ('serviceWorker' in navigator) {
      window.onload = () => {
        navigator.serviceWorker.register(new URL('sw.js', document.baseURI));
      }
    }
  </script>
</body>
</html>
